<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord Utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">Espace Utilisateur</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:if="${username != null}">
                Utilisateur : <strong th:text="${username}"></strong>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Se déconnecter</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <h2 class="card-title text-primary mb-3">👤 Tableau de bord Utilisateur</h2>
            <p class="text-muted">Cette section est accessible aux utilisateurs ayant le rôle <code>ROLE_USER</code> ou <code>ROLE_ADMIN</code>.</p>
            <div class="alert alert-info">
                Accès autorisé ! Bienvenue sur votre espace personnel.
            </div>
            <div class="mt-4">
                <a th:href="@{/home}" class="btn btn-secondary">Retour à l'accueil</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
