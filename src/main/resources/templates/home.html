<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Spring Security JPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">Spring Security JPA</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:if="${username != null}">
                Connecté en tant que : <strong th:text="${username}"></strong>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Se déconnecter</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
        <h1 class="display-6 fw-bold text-primary">Bienvenue sur l'application sécurisée</h1>
        <p class="lead">Authentification JDBC / JPA avec Spring Security et MySQL.</p>
        <hr class="my-4">

        <div class="mb-4">
            <h5>Informations de session :</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>Nom d'utilisateur :</strong> <span th:text="${username}"></span></li>
                <li class="list-group-item"><strong>Rôles :</strong>
                    <span th:each="role : ${roles}" class="badge bg-secondary me-1" th:text="${role.authority}"></span>
                </li>
            </ul>
        </div>

        <div class="d-flex gap-3">
            <a th:href="@{/user/dashboard}" class="btn btn-outline-primary">Espace Utilisateur (/user/dashboard)</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-outline-danger">Espace Admin (/admin/dashboard)</a>
        </div>
    </div>
</div>
</body>
</html>
