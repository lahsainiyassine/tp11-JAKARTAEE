<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Spring Security JPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 fw-bold text-primary">Authentification</h3>

                    <!-- Message d'erreur -->
                    <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                        Nom d'utilisateur ou mot de passe incorrect.
                    </div>

                    <!-- Message de déconnexion -->
                    <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                        Vous avez été déconnecté avec succès.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-muted small">
                        <strong>Comptes de test :</strong><br>
                        - Admin : <code>admin</code> / <code>1234</code><br>
                        - Utilisateur : <code>user</code> / <code>1111</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
