<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">Espace Administrateur</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:if="${username != null}">
                Admin : <strong th:text="${username}"></strong>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Se déconnecter</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <h2 class="card-title text-danger mb-3">🛠️ Tableau de bord Administrateur</h2>
            <p class="text-muted">Cette section est accessible uniquement aux utilisateurs ayant le rôle <code>ROLE_ADMIN</code>.</p>
            <div class="alert alert-success">
                Accès autorisé ! Bienvenue sur l'espace d'administration.
            </div>
            <div class="mt-4">
                <a th:href="@{/home}" class="btn btn-secondary">Retour à l'accueil</a>
                <a th:href="@{/user/dashboard}" class="btn btn-primary">Voir l'espace Utilisateur</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
